<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="csiaTitle csiaDesc">
  <title id="csiaTitle">CSIA Certified Chimney Sweep</title>
  <desc id="csiaDesc">Chimney Safety Institute of America Certified Chimney Sweep seal</desc>
  <!-- Official-style CCS seal recreation for web display (replace with member seal from CSIA if provided) -->
  <defs>
    <linearGradient id="csiaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f0c14b"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#0b2c4a"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#csiaGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#f0c14b" stroke-width="1.2" opacity="0.7"/>
  <!-- Outer ring text path -->
  <defs>
    <path id="csiaRing" d="M100,100 m-68,0 a68,68 0 1,1 136,0 a68,68 0 1,1 -136,0"/>
  </defs>
  <text fill="#f0c14b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">
    <textPath href="#csiaRing" startOffset="0%">CERTIFIED CHIMNEY SWEEP  ·  CSIA  ·  </textPath>
  </text>
  <!-- Inner disc -->
  <circle cx="100" cy="100" r="52" fill="#ffffff"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#0b2c4a" stroke-width="1.5"/>
  <!-- Chimney mark -->
  <g fill="#0b2c4a" transform="translate(100 88)">
    <rect x="-10" y="-22" width="20" height="10" rx="1"/>
    <rect x="-16" y="-14" width="32" height="6" rx="1"/>
    <path d="M-22,-8 h44 v34 h-12 v-16 h-20 v16 h-12 z"/>
    <rect x="-6" y="2" width="12" height="14" rx="1" fill="#c2410c"/>
  </g>
  <text x="100" y="138" text-anchor="middle" fill="#0b2c4a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="1">CSIA</text>
  <text x="100" y="152" text-anchor="middle" fill="#0b2c4a" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.6">CERTIFIED</text>
</svg>
